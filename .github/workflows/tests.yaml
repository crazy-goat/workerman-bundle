name: Tests

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# A newer pull request run cancels an older one on the same pull request; a
# master run is never cancelled by a later run, so a post-merge failure stays
# visible.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer Audit
        run: composer audit

      - name: Run code style checks
        run: composer lint

  # A pull request that touches only documentation does not need the nine-leg
  # tests matrix or the benchmark. This job classifies the diff once, so the
  # heavy jobs can skip themselves while lint (fast, and the only job that
  # catches a broken workflow YAML) and the ci aggregator still report. The
  # job runs on every trigger so its dependents never inherit a skip: on
  # non-pull-request events it always reports docs-only=false.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          # Only pull requests carry the file list needed to decide; pushes,
          # the weekly schedule and manual dispatch always run the full
          # matrix (the scheduled run exists to cover master).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Fall back to the PR merge-base when the base sha is unavailable
          # (for example on a freshly force-pushed branch); an empty base
          # would make git diff list every file in history.
          if [ -z "$base" ]; then
            base="$(git merge-base "$head" "origin/${{ github.base_ref }}" || true)"
          fi
          if [ -z "$base" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base" "$head")"
          # No changed files is not a docs-only change; run the full matrix.
          if [ -z "$files" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A change is docs-only when every touched file lives under docs/
          # or is a Markdown file. A broken workflow YAML under .github/ is
          # not documentation, so it falls through to the default branch and
          # keeps the full matrix running.
          docs_only=true
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md|*.mdx) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$files"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, detect-changes]
    if: github.event_name != 'schedule' && needs.detect-changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            symfony-version: '6.4.*'

          - php-version: '8.3'
            symfony-version: '6.4.*'
          - php-version: '8.3'
            symfony-version: '7.4.*'

          - php-version: '8.4'
            symfony-version: '6.4.*'
          - php-version: '8.4'
            symfony-version: '7.4.*'
          - php-version: '8.4'
            symfony-version: '8.0.*'

          - php-version: '8.5'
            symfony-version: '6.4.*'
          - php-version: '8.5'
            symfony-version: '7.4.*'
          - php-version: '8.5'
            symfony-version: '8.0.*'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip, inotify, pcntl, posix
          coverage: pcov
          ini-values: pcov.directory=src,phar.readonly=0

      - name: Create var directory
        run: mkdir -p var

      - name: Update Symfony constraints in composer.json
        run: |
          export SYMFONY_VERSION=${{ matrix.symfony-version }}
          sed -i -E "s/(\"symfony\/[a-z-]+\":\s*\")[^\"]+/\1$SYMFONY_VERSION/g" composer.json

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: composer test:coverage

      - name: Check coverage threshold
        # Gate on the lowest supported matrix leg only. The threshold is
        # defined once in composer.json (coverage:check) and per-leg coverage
        # is stable within ~0.1pp, so nine identical gates are wasted signal.
        if: matrix.php-version == '8.2' && matrix.symfony-version == '6.4.*'
        run: composer coverage:check

      - name: Sanitize artifact name
        id: artifact
        run: |
          name="coverage-${{ matrix.php-version }}-${{ matrix.symfony-version }}"
          name="${name//\*/x}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: var/coverage.xml
          if-no-files-found: ignore

  tests-scheduled:
    name: Tests (scheduled)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            symfony-version: '6.4.*'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip, inotify, pcntl, posix
          ini-values: phar.readonly=0

      - name: Create var directory
        run: mkdir -p var

      - name: Update Symfony constraints in composer.json
        run: |
          export SYMFONY_VERSION=${{ matrix.symfony-version }}
          sed -i -E "s/(\"symfony\/[a-z-]+\":\s*\")[^\"]+/\1$SYMFONY_VERSION/g" composer.json

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: [lint, detect-changes]
    if: github.event_name != 'schedule' && needs.detect-changes.outputs.docs-only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run benchmarks
        run: composer bench

  ci:
    name: CI
    needs: [lint, tests, benchmark, tests-scheduled, detect-changes]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then exit 1; fi
          # A docs-only pull request intentionally skips the tests and
          # benchmark jobs; that is a green result, not a failure. On
          # non-pull-request events detect-changes reports docs-only=false.
          docs_only="${{ needs.detect-changes.outputs.docs-only }}"
          if [ "$docs_only" = "true" ]; then
            echo "Docs-only change: tests and benchmark intentionally skipped"
            exit 0
          fi
          # Scheduled runs trim the matrix to a single leg, so the rest of
          # the tests job is skipped; either tests job succeeding is enough.
          if [ "${{ needs.tests.result }}" != "success" ] && [ "${{ needs.tests-scheduled.result }}" != "success" ]; then exit 1; fi
          # Benchmark is intentionally advisory: CI runner timing varies too
          # much to gate merges on it — log status but do not block merge
          echo "Benchmark status: ${{ needs.benchmark.result }}"

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="Scheduled CI run failed"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$marker in:title" --limit 1 --json number --jq '.[0].number // empty')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$marker ($(date -u +%Y-%m-%d))" \
              --body "The weekly scheduled CI run ([#$GITHUB_RUN_ID]($run_url)) failed. Likely causes: a new composer audit advisory, dependency drift, or a broken master. Check the run logs, then close this issue once resolved."
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again in [run #$GITHUB_RUN_ID]($run_url)."
          fi
