name: Tests

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Authenticated Composer downloads avoid the anonymous GitHub API rate limit in every job.
env:
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

# A newer pull request run cancels an older one on the same pull request; a
# master run is never cancelled by a later run, so a post-merge failure stays
# visible.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The required status check is `ci-ok`. Fork pull requests need a maintainer's approval
# to run workflows (repository/organisation setting), so no actor check is needed here.
jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main
    with:
      # Narrow on purpose: PHPUnit reads every tracked Markdown file (MarkdownLinkTest,
      # KnowledgeBaseTest, BinDirectoryTest) and bin/lint.sh checks CHANGELOG.md, so only
      # files that no test or linter reads count as documentation.
      docs-regex: '^(LICENSE.*|\.github/ISSUE_TEMPLATE/.*)$'

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install shellcheck and hadolint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-v0.11.0/shellcheck
          curl -fsSL -o "$HOME/.local/bin/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run lint
        run: bin/lint.sh

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            symfony-version: '6.4.*'

          - php-version: '8.3'
            symfony-version: '6.4.*'
          - php-version: '8.3'
            symfony-version: '7.4.*'

          - php-version: '8.4'
            symfony-version: '6.4.*'
          - php-version: '8.4'
            symfony-version: '7.4.*'
          - php-version: '8.4'
            symfony-version: '8.0.*'

          - php-version: '8.5'
            symfony-version: '6.4.*'
          - php-version: '8.5'
            symfony-version: '7.4.*'
          - php-version: '8.5'
            symfony-version: '8.0.*'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: zip, inotify, pcntl, posix
          coverage: pcov
          ini-values: pcov.directory=src,phar.readonly=0

      - name: Create var directory
        run: mkdir -p var

      - name: Update Symfony constraints in composer.json
        run: |
          export SYMFONY_VERSION=${{ matrix.symfony-version }}
          # symfony/deprecation-contracts versions 2.x/3.x only — it has no
          # 6.4/7.4/8.0 line, so it is excluded from the matrix rewrite (#588).
          sed -i -E "/deprecation-contracts/!s/(\"symfony\/[a-z-]+\":\s*\")[^\"]+/\1$SYMFONY_VERSION/g" composer.json

      # Matrix jobs intentionally resolve fresh dependencies after rewriting
      # Symfony constraints; lint and benchmark install the committed lock.
      - name: Update dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: composer test:coverage

      - name: Check coverage threshold
        # Gate on the lowest supported matrix leg only. The threshold is
        # defined once in composer.json (coverage:check) and per-leg coverage
        # is stable within ~0.1pp, so nine identical gates are wasted signal.
        if: matrix.php-version == '8.2' && matrix.symfony-version == '6.4.*'
        run: composer coverage:check

      - name: Sanitize artifact name
        id: artifact
        run: |
          name="coverage-${{ matrix.php-version }}-${{ matrix.symfony-version }}"
          name="${name//\*/x}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: var/coverage.xml
          if-no-files-found: ignore

  tests-root-permissions:
    name: Tests (root-only cache permissions)
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.2'
          extensions: zip, pcntl, posix
          ini-values: phar.readonly=0
          tools: composer:v2

      - name: Create var directory
        run: mkdir -p var

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run root-only permission tests and reject skips
        run: |
          set -euo pipefail
          filter='testLoadFromCacheRefusesGroupWritableCacheDirectoryOfForeignGroup|testLoadFromCacheRefusesCacheFileOwnedByAnotherUser|testLoadFromCacheProceedsWithWarningForForeignOwnedFileWhenTrustSet'
          php_bin="$(command -v php)"
          output="$(sudo "$php_bin" vendor/bin/phpunit --no-coverage --filter="$filter" tests/ConfigLoaderTest.php 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          # PHPUnit 10 prints "OK (3 tests, N assertions)" when clean and
          # "Tests: 3, Assertions: 0, Skipped: 3." when the tests skipped
          # (chgrp/chown failed). A skip here means the root leg lost its
          # privileges, which must fail the job rather than pass silently.
          if grep -Eq 'some tests were skipped|Skipped: [1-9]' <<<"$output"; then
            echo 'Root-only cache permission tests were skipped; the leg must run as root.' >&2
            exit 1
          fi
          if ! grep -Eq 'OK \(3 tests|Tests: 3,' <<<"$output"; then
            echo 'Expected exactly the three root-only cache permission tests to run.' >&2
            exit 1
          fi

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run benchmarks
        run: composer bench

  # Benchmark is advisory (runner timing varies too much to gate merges on it), so it is
  # not part of `needs`.
  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, tests, tests-root-permissions]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="Scheduled CI run failed"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$marker in:title" --limit 1 --json number --jq '.[0].number // empty')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$marker ($(date -u +%Y-%m-%d))" \
              --body "The weekly scheduled CI run ([#$GITHUB_RUN_ID]($run_url)) failed. Likely causes: a new composer audit advisory, dependency drift, or a broken master. Check the run logs, then close this issue once resolved."
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again in [run #$GITHUB_RUN_ID]($run_url)."
          fi
